<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>隅途咖啡 POS</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
        background: #f7f1e7;
        color: #2b241c;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 560px);
        background: rgba(255, 252, 246, 0.82);
        border: 1px solid rgba(129, 103, 76, 0.16);
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 10px 32px rgba(69, 52, 32, 0.07);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 30px;
      }
      p {
        line-height: 1.7;
        color: #776b5f;
      }
      code {
        display: block;
        margin: 12px 0;
        padding: 12px;
        background: #efe5d7;
        border-radius: 8px;
        color: #2b241c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>隅途 POS V1.1</h1>
      <p>V1.1 已改為正式 PWA 入口，支援商品管理與歷史日期報表。請用本機開發伺服器或 Vercel 網址開啟，不再用 file:// 直接營業。</p>
      <code>npm install<br />npm run dev</code>
      <p>部署後請在 iPad mini Safari 開啟網址，使用「加入主畫面」。</p>
    </main>
  </body>
</html>
